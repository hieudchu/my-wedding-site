<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/medallion-ink.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hiếu & Minh — Thiệp cưới</title>
    <meta name="description" content="Trân trọng kính mời quý vị và các bạn đến chia vui cùng chúng em trong ngày trọng đại." />
    <meta name="theme-color" content="#160607" />

    <!-- Ảnh + chữ khi gửi link qua Messenger / Zalo / WhatsApp / Facebook. Các app này không
         chạy JS, chỉ đọc thẻ tĩnh ở đây, nên URL ảnh phải tuyệt đối. Ảnh: public/og-hieu-minh-1.jpg
         (1200×630, < 300 KB cho WhatsApp; tên ở giữa để WhatsApp cắt vuông vẫn còn).
         Đổi ảnh thì đổi TÊN FILE (-2, -3…), không thêm ?v= — bot Zalo bỏ qua ảnh có tham số. Các app giữ bản cũ nhiều ngày. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:site_name" content="Thiệp cưới Hiếu & Minh" />
    <meta property="og:url" content="https://hieu-minh-wedding.vercel.app/" />
    <meta property="og:title" content="Thiệp cưới Đăng Hiếu & Thiện Minh · 15.01.2027" />
    <meta property="og:description" content="Trân trọng kính mời quý vị và các bạn đến chia vui cùng chúng em trong ngày trọng đại." />
    <meta property="og:image" content="https://hieu-minh-wedding.vercel.app/og-hieu-minh-1.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Thiệp cưới Đăng Hiếu & Thiện Minh, 15.01.2027, Sheraton Hanoi" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://hieu-minh-wedding.vercel.app/og-hieu-minh-1.jpg" />

    <!-- Font self-host: không phụ thuộc CDN, chỉ giữ subset latin/latin-ext/vietnamese -->
    <!-- Mở sẵn kết nối tới Supabase trước khi JS chạy: một cho fetch (CORS), một cho ảnh -->
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/cormorant-garamond-500-vietnamese.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-400-vietnamese.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/playfair-display-400-latin.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Hỏi nội dung + bản kê ảnh NGAY khi HTML tới, song song với lúc tải JS.
      Trước đây phải đợi JS chạy xong mới hỏi, rồi trình duyệt còn gửi thêm một lượt
      "hỏi đường" (CORS preflight) vì supabase-js gắn header riêng — ảnh đầu tiên
      chỉ bắt đầu tải sau khoảng 2 giây trên 4G. Fetch trơn, apikey đặt trên URL,
      không header riêng → không có preflight. Khoá publishable vốn đã nằm trong JS.
      useSiteConfig dùng kết quả này; hỏng thì tự hỏi lại bằng supabase-js.
    -->
    <script>
      (function () {
        var url = '%VITE_SUPABASE_URL%', key = '%VITE_SUPABASE_PUBLISHABLE_KEY%';
        if (!/^https:/.test(url) || key.charAt(0) === '%' || !window.fetch) return;
        window.__siteConfig = fetch(url + '/rest/v1/site_config?select=key,value&apikey=' + encodeURIComponent(key))
          .then(function (r) { return r.ok ? r.json() : null; })
          .catch(function () { return null; });
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
