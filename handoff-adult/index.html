<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thiệp mời /adult · Hiếu &amp; Minh (handoff)</title>
    <meta name="theme-color" content="#160607" />
    <link rel="icon" type="image/png" href="./assets/medallion-ink.png" />

    <!-- Năm bộ chữ tự host, giống hệt production: Cormorant Garamond, Inter,
         JetBrains Mono, TAN Whistling (không có trên Google Fonts), Playfair Display. -->
    <link rel="preload" as="font" type="font/woff2" href="./fonts/cormorant-garamond-500-vietnamese.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/inter-400-vietnamese.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="./fonts/playfair-display-400-latin.woff2" crossorigin />
    <link rel="stylesheet" href="./fonts/fonts.css" />

    <!-- Bản sao CSS production. main.jsx nạp 4 file đầu cho MỌI route, kể cả /adult. -->
    <link rel="stylesheet" href="./styles/globals.css" />
    <link rel="stylesheet" href="./styles/sections.css" />
    <link rel="stylesheet" href="./styles/desktop.css" />
    <link rel="stylesheet" href="./styles/mobile.css" />
    <!-- Trang /adult: CSS riêng, class a- (app/src/adult/adult.css) -->
    <link rel="stylesheet" href="./styles/adult.css" />
  </head>

  <body>
    <div id="root"></div>

    <!-- Nội dung thật chụp từ Supabase → window.__DB__ -->
    <script src="./data/db.js"></script>

    <!-- React 18 + Babel: JSX chạy thẳng trong trình duyệt, không cần build -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

    <!-- Toàn bộ giao diện. Babel tải bằng XHR nên PHẢI mở qua http:// — xem README.md -->
    <script type="text/babel" src="./app.jsx" data-presets="react"></script>

    <script>
      window.addEventListener('load', function () {
        if (location.protocol !== 'file:') return;
        document.getElementById('root').innerHTML =
          '<div style="font-family:system-ui;max-width:640px;margin:15vh auto;padding:0 24px;line-height:1.7;color:#6B564F">' +
          '<h1 style="font-weight:500">Cần chạy qua máy chủ cục bộ</h1>' +
          '<p>Trình duyệt chặn tải <code>app.jsx</code> khi mở bằng <code>file://</code>.</p>' +
          '<ul><li>Double-click <b>start.command</b> (macOS)</li>' +
          '<li>Hoặc: <code>python3 -m http.server 8000</code> trong thư mục này rồi mở <code>http://localhost:8000</code></li></ul>' +
          '</div>';
      });
    </script>
  </body>
</html>
