<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;overflow:hidden;display:flex;background:#32000C}
.ph{width:540px;height:630px;object-fit:cover;object-position:50% 62%;flex:none}
.side{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
 background:url('assets/floral-relief.jpg') center/cover,#32000C;background-blend-mode:overlay,normal;box-shadow:inset 18px 0 30px -18px rgba(0,0,0,.7)}
.card{position:relative;width:592px;height:566px;background:#4A000B;border-radius:6px;border:1px solid rgba(0,0,0,.35);
 box-shadow:0 34px 70px -30px rgba(0,0,0,.85),0 8px 16px -4px rgba(0,0,0,.8);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#FBF1DF}
.fr{position:absolute;inset:14px;border:1px solid #A2714E}
.fr::after{content:'';position:absolute;inset:6px;border:1px solid rgba(162,113,78,.45)}
.eb{font-family:'Inter',sans-serif;font-size:16px;letter-spacing:.36em;color:#D8B778;display:flex;align-items:center;gap:16px}
.eb i{display:block;width:40px;height:1px;background:#D8B778;opacity:.8}
.names{margin:20px 0 14px;color:#FBF1DF;-webkit-text-stroke:.6px #FBF1DF}
.nm{font-family:'TAN Whistling';font-size:58px;line-height:1.12;white-space:nowrap;display:block}
.amp{font-family:'TAN Whistling';font-size:36px;color:#D8B778;-webkit-text-stroke:0;display:block;line-height:1;margin:2px 0 4px}
.dia{position:relative;display:inline-block}.dia::after{position:absolute}
.dia-ac::after{content:'';width:.05em;height:.17em;border-radius:.03em;background:currentColor;top:.06em;left:74%;transform:rotate(40deg)}
.dia-dot::after{content:'.';line-height:1;bottom:-.06em;left:50%;transform:translateX(-50%)}
.inv{font-family:'Playfair Display',serif;font-size:24px;line-height:1.45;color:rgba(251,241,223,.92)}
.inv em{color:#D8B778}
.rule{width:150px;height:1px;background:linear-gradient(90deg,transparent,#D8B778,transparent);margin:20px auto 18px}
.when{font-family:'Playfair Display',serif;font-size:26px;color:#FBF1DF}
.when b{color:#D8B778;font-weight:600}
.where{font-family:'Inter',sans-serif;font-size:15px;letter-spacing:.3em;color:#D8B778;margin-top:12px}
.seal{width:50px;margin-bottom:16px}
</style></head><body>
<img class="ph" src="assets/photos/background-moment-2.webp">
<div class="side"><div class="card"><div class="fr"></div>
 <img class="seal" src="assets/medallion-gold.png">
 <div class="eb"><i></i>THIỆP CƯỚI<i></i></div>
 <div class="names"><span class="nm">Đăng Hi<span class="dia dia-ac">ê</span>u</span><span class="amp">&amp;</span><span class="nm">Thi<span class="dia dia-dot">ê</span>n Minh</span></div>
 <p class="inv">Trân trọng kính mời <em>Quý khách</em><br>tới dự lễ thành hôn của hai con chúng tôi</p>
 <div class="rule"></div>
 <p class="when"><b>18:30</b> · Thứ sáu, 15.01.2027</p>
 <p class="where">KHÁCH SẠN SHERATON · HÀ NỘI</p>
</div></div>
</body></html>
